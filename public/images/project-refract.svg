<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
<title id="title">Project Refract concept</title><desc id="desc">A transparent geometric prism divides a beam of light into multiple paths, symbolizing recursive exploration and multiple perspectives.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#18233d"/><stop offset="1" stop-color="#080e1b"/></linearGradient>
 <linearGradient id="beam"><stop stop-color="#8be4ff" stop-opacity="0"/><stop offset=".45" stop-color="#d6f6ff"/><stop offset="1" stop-color="#85a8ff" stop-opacity=".15"/></linearGradient>
 <linearGradient id="prism" x2="1" y2="1"><stop stop-color="#9be9ff" stop-opacity=".45"/><stop offset=".5" stop-color="#8d9cff" stop-opacity=".08"/><stop offset="1" stop-color="#e7faff" stop-opacity=".28"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="720" height="440" rx="28" fill="url(#bg)"/>
<path d="M0 220H720M360 0V440" stroke="#9fd7f5" stroke-opacity=".08" stroke-dasharray="4 9"/>
<circle cx="355" cy="220" r="150" fill="#6bbfe8" opacity=".1" filter="url(#glow)"/>
<path d="M22 220H292" stroke="url(#beam)" stroke-width="12" opacity=".8"/>
<path d="M22 220H292" stroke="#d9f7ff" stroke-width="2"/>
<path d="M292 220L360 105 428 220 360 335Z" fill="url(#prism)" stroke="#d7f6ff" stroke-width="2.4"/>
<path d="M292 220L360 105 428 220 360 335Z" fill="none" stroke="#8ddfff" stroke-opacity=".6" stroke-width="1"/>
<g fill="none" stroke-linecap="round">
 <path d="M428 220L680 74" stroke="#80dfff" stroke-width="3"/>
 <path d="M428 220L680 152" stroke="#91b7ff" stroke-width="3"/>
 <path d="M428 220L680 220" stroke="#e2f8ff" stroke-width="3"/>
 <path d="M428 220L680 288" stroke="#b2a6ff" stroke-width="3"/>
 <path d="M428 220L680 366" stroke="#6dc7ee" stroke-width="3"/>
</g>
<g fill="#d8f7ff">
 <circle cx="428" cy="220" r="6"/><circle cx="548" cy="151" r="4"/><circle cx="580" cy="220" r="4"/><circle cx="548" cy="289" r="4"/>
</g>
<g fill="none" stroke="#9bdcf7" stroke-opacity=".45"><ellipse cx="360" cy="220" rx="214" ry="164" transform="rotate(-28 360 220)" stroke-dasharray="5 10"/><ellipse cx="360" cy="220" rx="164" ry="214" transform="rotate(38 360 220)" stroke-dasharray="2 12"/></g>
<g fill="#e3f8ff" font-family="Arial,sans-serif" font-size="10" letter-spacing="3" opacity=".75"><text x="38" y="42">RECURSIVE EXPLORATION</text><text x="38" y="408">MULTIPLE PATHS · REVIEW · REFINEMENT</text></g>
</svg>